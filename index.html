<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <script>
    (() => {
      if (location.hash === "#tree") {
        history.replaceState(history.state, "", location.pathname + location.search);
        return;
      }
      const navigation = performance.getEntriesByType?.("navigation")[0];
      if (navigation && navigation.type !== "navigate") return;

      const now = Date.now();
      const trial = new URLSearchParams(location.search).get("try") === "winter-surprise"
        && now >= Date.parse("2026-11-23T07:29:00Z") && now < Date.parse("2026-11-23T08:00:00Z");
      const odds = trial ? 2 : 100000;
      const limit = Math.floor(2 ** 32 / odds) * odds;
      const word = new Uint32Array(1);
      // Discard the incomplete last bucket so every outcome has exactly equal weight.
      do {
        crypto.getRandomValues(word);
      } while (word[0] >= limit);
      if (word[0] % odds === 0) {
        location.replace(trial ? "./winter-surprise.html#trial-draw" : "./winter-surprise.html#draw");
        document.documentElement.hidden = true;
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 圣诞树 🎄</title>
  <link rel="icon" href="data:,">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #050505;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #c5a880;
    }

    #three-canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #start-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 1s ease;
    }

    .modal-content {
      background: linear-gradient(145deg, #1a1a1a, #2a2a2a);
      padding: 40px;
      border-radius: 20px;
      border: 2px solid #c5a880;
      box-shadow: 0 0 30px rgba(197, 168, 128, 0.3);
      text-align: center;
      max-width: 90%;
      width: 400px;
    }

    .modal-title {
      font-size: 2rem;
      color: #c5a880;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .modal-text {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 30px;
    }

    .btn-group {
      display: flex;
      justify-content: space-around;
      gap: 20px;
      position: relative;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      outline: none;
    }

    .btn-accept {
      background: linear-gradient(45deg, #d4af37, #c5a880);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }

    .btn-accept:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
    }

    .btn-reject {
      background: #333;
      color: #888;
      border: 1px solid #555;
    }

    /* 文本容器样式（保持原视觉效果） */
    .christmas-text-container {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Brush Script MT', cursive;
      font-size: 4rem;
      background: linear-gradient(to bottom, #fff, #c5a880);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(197, 168, 128, 0.5);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      width: 100%;
      transition: opacity 1s ease;
    }

    /* To刘媛：显示3秒 → 淡出隐藏（总时长4秒） */
    .fade-in-out {
      animation: fadeInOut 4s forwards ease-in-out;
    }

    /* Merry Christmas：基础淡入动画（无延迟，通过JS控制触发） */
    .fade-in {
      animation: fadeInText 3s forwards ease-in-out;
    }

    /* To刘媛动画：0→1秒淡入 → 1→3秒保持显示 → 3→4秒淡出 */
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, -30%); }
      25% { opacity: 1; transform: translate(-50%, -50%); }
      75% { opacity: 1; transform: translate(-50%, -50%); }
      100% { opacity: 0; transform: translate(-50%, -50%); }
    }

    /* Merry Christmas基础淡入动画 */
    @keyframes fadeInText {
      0% { opacity: 0; transform: translate(-50%, -30%); }
      100% { opacity: 1; transform: translate(-50%, -50%); }
    }

    .loading {
      color: white;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
    }

    @media (max-width: 600px) {
      .modal-content { width: 90%; padding: 20px; }
      .modal-title { font-size: 1.5rem; }
      .christmas-text-container { font-size: 2.5rem; top: 10%; }
    }
    body {
      background:
        radial-gradient(ellipse at 50% 84%, #3d302332, transparent 29%),
        radial-gradient(ellipse at 50% 100%, #102936 0%, #08141d 33%, transparent 65%),
        radial-gradient(ellipse at 50% 48%, #252218, #080e10 44%, #03070b 76%);
    }
    #tree-star {
      --star-size: 36px;
      position: absolute;
      left: 50%;
      top: 20%;
      z-index: 1;
      pointer-events: none;
      width: var(--star-size);
      height: var(--star-size);
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 4px #ffc86d) drop-shadow(0 0 16px #eaa23c99);
    }
    #tree-star::before, #tree-star::after {
      position: absolute;
      content: "";
      inset: 0;
    }
    #tree-star::before {
      background: conic-gradient(from -17deg, #fff8c7, #eaa43b 15%, #fff9d9 30%, #d18a3b 46%, #fff0ae 62%, #bd7634 76%, #fff4bd 94%);
      clip-path: polygon(50% 0%, 61% 35%, 99% 36%, 68% 59%, 81% 97%, 50% 74%, 19% 97%, 31% 59%, 1% 36%, 39% 35%);
    }
    #tree-star::after {
      inset: -90%;
      background:
        radial-gradient(ellipse 48% 1.8% at 50% 50%, #ffe9a699, transparent),
        radial-gradient(ellipse 1.3% 44% at 50% 50%, #fff6bf99, transparent),
        radial-gradient(ellipse at center, #fff5b86e, #dda54718 32%, transparent 67%);
    }
    #start-modal { background: #030609eb; }
    .btn:focus-visible { outline: 2px solid #ffe9b6; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .btn, #start-modal { transition-duration: .01ms; }
    }

  </style>
</head>

<body>
  <div class="loading">加载中...</div>
  <canvas id="three-canvas" aria-label="金色粒子圣诞树"></canvas>
  <span id="tree-star" aria-hidden="true"></span>
  <div id="start-modal">
    <div class="modal-content">
      <div class="modal-title">🎁 圣诞礼物</div>
      <p class="modal-text">叮咚！你有一份来自圣诞老人的专属礼物，是否查收？</p>
      <div class="btn-group" id="btn-container">
        <button class="btn btn-reject" id="btn-no">残忍拒绝</button>
        <button class="btn btn-accept" id="btn-yes">开心收下</button>
      </div>
    </div>
  </div>

  <!-- 两个独立文本元素 -->
  <div class="christmas-text-container" id="text-to">To 刘媛</div>
  <div class="christmas-text-container" id="text-merry">Merry Christmas</div>
  
  <audio id="christmas-music" preload="none" loop>
    <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Dott/This_Christmas/Dott_-_01_-_This_Christmas.mp3" type="audio/mpeg">
    您的浏览器不支持音频元素。
  </audio>

  <script>
    // Geometry is uploaded once. Each grain carries its own size, phase and material.
    function startChristmasScene() {
      let canvas = document.getElementById('three-canvas');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const compact = innerWidth < 650;
      const tau = Math.PI * 2;
      const data = [];
      let seed = 8172421;
      function random() {
        seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
        return seed / 4294967296;
      }
      function grain(x, y, z, color, diameter, type, brightness) {
        data.push(x, y, z, color[0], color[1], color[2], diameter, random() * tau, type, brightness);
      }
      const pine = [[.18,.46,.32], [.33,.63,.4], [.56,.65,.34], [.85,.69,.36], [1,.88,.59]];
      const gold = [[1,.60,.20], [1,.78,.38], [1,.89,.61], [1,.95,.79]];
      const baubles = [[1,.25,.24], [.96,.47,.27], [.28,.76,.69], [1,.82,.45]];
      const radius = depth => .345 * Math.pow(depth, .9) + .004;

      for (let tier = 0; tier < 17; tier++) {
        const depth = (tier + .65) / 17;
        const branches = Math.floor(7 + depth * 20);
        for (let branch = 0; branch < branches; branch++) {
          const phi = branch / branches * tau + tier * 2.4 + (random() - .5) * .17;
          const length = radius(depth) * (.84 + random() * .18);
          const drift = (random() - .5) * .026;
          const n = Math.ceil((compact ? 36 : 62) + depth * (compact ? 56 : 105));
          for (let i = 0; i < n; i++) {
            const u = .035 + .965 * Math.pow(random(), .72);
            const side = random() * 2 - 1;
            const wing = Math.sin(u * Math.PI) * (.48 + .52 * ((u * 12) % 1));
            const off = side * wing * (.007 + length * .24);
            const height = 1 - depth + drift - .036 * u + .016 * u ** 6 + (random() - .5) * (.014 + depth * .028);
            const illum = random() + .56 * u + .16 * Math.cos(phi);
            const shade = Math.max(0, Math.min(4, Math.floor(illum * 2.7)));
            grain(Math.cos(phi) * length * u - Math.sin(phi) * off, height,
              Math.sin(phi) * length * u + Math.cos(phi) * off, pine[shade],
              1.1 + random() ** 2.6 * 3.1, 0, .41 + .53 * u + random() * .32);
          }
        }
      }

      const ribbonCount = compact ? 3900 : 7300;
      for (let i = 0; i < ribbonCount; i++) {
        const t = Math.pow(random(), .83);
        const phi = t * tau * 5.06 + .7;
        const strand = i % 3;
        const a = phi + .026 * strand + (random() - .5) * .064;
        const r = radius(t) * 1.044 + .002 * strand + (random() - .5) * (.002 + t * .008);
        const y = 1.006 - t - Math.sin(phi * 2) * .016 * t + (strand - 1) * .003 + (random() - .5) * .007;
        grain(Math.cos(a) * r, y, Math.sin(a) * r, gold[i % 4], 1.3 + random() ** 2 * 2.8, 1, .62 + random() * .38);
      }
      for (let i = 0; i < (compact ? 160 : 280); i++) {
        const t = .075 + .9 * Math.sqrt(random());
        const a = random() * tau;
        const r = radius(t) * (.89 + random() * .13);
        grain(Math.cos(a) * r, 1 - t, Math.sin(a) * r, baubles[i % 4],
          3.1 + random() ** 2 * 5.5, 2, .8 + random() * .2);
      }
      for (let i = 0; i < (compact ? 2200 : 5200); i++) {
        const a = random() * tau;
        const near = i % 4 === 0;
        const r = near ? .14 + random() * .32 : Math.sqrt(random()) * 2.7;
        const color = near && random() < .64 ? [.95,.72,.4] : [.26,.64,.96];
        grain(Math.cos(a) * r, -.056 + random() * .019, Math.sin(a) * r,
          color, .95 + random() ** 2.8 * 4.6, 3, (near ? .83 : .68) * (.43 + random()));
      }
      for (let i = 0; i < (compact ? 165 : 340); i++) {
        grain(random(), random(), random(), [.81,.91,1], 1.2 + random() ** 4 * 8.3, 4, .43 + random() * .58);
      }
      const points = new Float32Array(data);
      const view = { width: 0, height: 0, unit: 0, base: 0, dpr: 1 };
      const star = document.getElementById('tree-star');
      let gl;
      try {
        gl = canvas.getContext('webgl', { alpha: true, antialias: false, depth: false, premultipliedAlpha: true });
      } catch {
        gl = null;
      }
      let draw;
      if (gl) {
        const vertex = `
          precision highp float;
          attribute vec3 position;
          attribute vec3 tint;
          attribute vec4 grain;
          uniform vec4 view;
          uniform vec4 motion;
          varying mediump vec3 color;
          varying mediump vec2 kind;
          void main() {
            float t = motion.x;
            float shape = grain.z;
            float wave = .5 + .5 * sin(grain.y + t * 1.7);
            vec2 screen;
            float scale;
            float shine;
            if (shape > 3.5) {
              scale = .65 + position.z;
              screen = vec2(fract(position.x + sin(t * .15 + grain.y) * .008) * view.x,
                            fract(position.y + t * (.012 + position.z * .018)) * view.y);
              shine = grain.w * (.63 + .37 * wave);
            } else {
              vec3 p = position;
              float a = shape < 2.5 ? motion.y : 0.0;
              float x = p.x * cos(a) + p.z * sin(a);
              float z = p.z * cos(a) - p.x * sin(a);
              scale = 3.4 / (3.4 - z * .55);
              screen = vec2(view.x * .5 + x * scale * view.z,
                       view.w - (p.y - z * .21) * scale * view.z);
              shine = grain.w * clamp(.82 + .53 * z,.43,1.2) * (.79 + .21 * wave);
              if (shape > .5 && shape < 1.5) {
                float pulse = .5 + .5 * cos(t * 1.95 - p.y * 15.5);
                shine *= .83 + .61 * pow(pulse, 5.0);
              }
            }
            gl_Position = vec4(screen.x * 2.0 / view.x - 1.0,1.0 - screen.y * 2.0 / view.y,0.0,1.0);
            gl_PointSize = max(1.0,grain.x * scale * motion.z * motion.w);
            color = tint * shine;
            kind = vec2(shape, grain.y);
          }`;
        const fragment = `
          precision mediump float;
          varying mediump vec3 color;
          varying mediump vec2 kind;
          void main() {
            vec2 p = gl_PointCoord * 2.0 - 1.0;
            float ds = dot(p,p);
            float light = exp(-3.5 * ds) * (1.0 - smoothstep(.50,1.0,ds));
            if (kind.x > 1.5 && kind.x < 2.5) {
              light += .52 * exp(-15. * ds) + .18 * exp(-18.*min(abs(p.x),abs(p.y))) * (1.-smoothstep(.35,1.,ds));
            }
            if (kind.x > 3.5) {
              float r = sqrt(ds);
              float arm = pow(abs(cos(3.0 * atan(p.y, p.x + .00001) + kind.y)), 8.0);
              light = (.58 * exp(-5.0 * ds) + .67 * arm) * (1.0 - smoothstep(.42, .98, r));
            }
            vec3 rgb = color * light;
            gl_FragColor = vec4(rgb, max(max(rgb.r, rgb.g),rgb.b));
          }`;
        function compile(type, code) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, code);
          gl.compileShader(shader);
          return shader;
        }
        const program = gl.createProgram();
        gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex));
        gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment));
        gl.linkProgram(program);
        if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
          gl.useProgram(program);
          gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(gl.ARRAY_BUFFER, points, gl.STATIC_DRAW);
          for (const [name, size, offset] of [['position',3,0], ['tint',3,3], ['grain',4,6]]) {
            const attribute = gl.getAttribLocation(program, name);
            gl.enableVertexAttribArray(attribute);
            gl.vertexAttribPointer(attribute, size, gl.FLOAT, false, 40, offset * 4);
          }
          const viewLocation = gl.getUniformLocation(program, 'view');
          const motionLocation = gl.getUniformLocation(program, 'motion');
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE);
          gl.clearColor(0,0,0,0);
          draw = time => {
            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.uniform4f(viewLocation, view.width, view.height, view.unit, view.base);
            gl.uniform4f(motionLocation, time, time * .095 + .47, view.dpr, Math.max(.78, Math.min(1.36, view.unit / 505)));
            gl.drawArrays(gl.POINTS, 0, points.length / 10);
          };
        }
      }
      function useCanvas() {
        if (gl) {
          const replacement = canvas.cloneNode(false);
          canvas.replaceWith(replacement);
          canvas = replacement;
        }
        const ctx = canvas.getContext('2d');
        const colors = [];
        for (let i = 0; i < points.length; i += 10) {
          colors.push('rgb(' + [3,4,5].map(k => Math.round(255 * points[i + k])).join(',') + ')');
        }
        draw = time => {
          ctx.setTransform(view.dpr,0,0,view.dpr,0,0);
          ctx.clearRect(0,0,view.width,view.height);
          ctx.globalCompositeOperation = 'lighter';
          const a = time * .095 + .47;
          const c = Math.cos(a), s = Math.sin(a);
          for (let i = 0; i < points.length; i += 20) {
            const x = points[i], y = points[i + 1], z = points[i + 2];
            const phase = points[i + 7], kind = points[i + 8];
            const depth = kind < 2.5 ? z * c - x * s : z;
            const scale = 3.4 / (3.4 - depth * .55);
            let sx = view.width * .5 + (kind < 2.5 ? x * c + z * s : x) * scale * view.unit;
            let sy = view.base - (y - depth * .21) * scale * view.unit;
            if (kind === 4) {
              sx = (x + Math.sin(time * .15 + phase) * .008) * view.width;
              sy = ((y + time * (.012 + z * .018)) % 1) * view.height;
            }
            const size = Math.max(.55, Math.min(4.5, points[i + 6] * .59 * scale * Math.max(.75,view.unit / 505)));
            ctx.fillStyle = colors[i / 10];
            ctx.globalAlpha = Math.min(1, points[i + 9] * (.77 + .23 * Math.sin(phase + time * 1.7)));
            ctx.fillRect(sx - size / 2, sy - size / 2, size, size);
          }
          ctx.globalAlpha = 1;
        };
      }
      if (!draw) useCanvas();
      if (gl) canvas.addEventListener('webglcontextlost', () => { useCanvas(); resize(); }, { once: true });
      let elapsed = 0, previous = 0, frame = 0, opened = false;
      function resize() {
        view.width = innerWidth;
        view.height = innerHeight;
        view.dpr = Math.min(devicePixelRatio || 1, compact ? 1.55 : 1.8);
        view.unit = Math.min(view.height * .645, view.width * 1.06);
        view.base = view.height * .525 + view.unit * .51;
        canvas.width = Math.round(view.width * view.dpr);
        canvas.height = Math.round(view.height * view.dpr);
        star.style.top = (view.base - view.unit * 1.021) + 'px';
        star.style.setProperty('--star-size', Math.max(25, view.unit * .079) + 'px');
        draw(elapsed);
      }
      function animate(stamp) {
        frame = 0;
        if (document.hidden || !opened) { previous = 0; return; }
        if (!gl && previous && stamp - previous < 32) {
          frame = requestAnimationFrame(animate);
          return;
        }
        elapsed += previous ? Math.min(.08, (stamp - previous) / 1000) : 0;
        previous = stamp;
        draw(elapsed);
        if (!reduced) frame = requestAnimationFrame(animate);
      }
      resize();
      document.getElementById('btn-yes').addEventListener('click', () => {
        opened = true;
        if (!reduced && !frame) frame = requestAnimationFrame(animate);
      }, { once: true });
      addEventListener('resize', resize);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { cancelAnimationFrame(frame); frame = 0; previous = 0; }
        else if (opened && !frame && !reduced) frame = requestAnimationFrame(animate);
      });
      document.querySelector('.loading').style.display = 'none';
    }

    const modal = document.getElementById('start-modal');
    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');
    const textTo = document.getElementById('text-to');
    const textMerry = document.getElementById('text-merry');
    const christmasMusic = document.getElementById('christmas-music');

    btnNo.addEventListener('mouseenter', moveButton);
    btnNo.addEventListener('click', () => {
        alert("骗你的，其实点了也没用！🎄🎄🎄");
    });

    function moveButton() {
        if(window.innerWidth < 768) return;
        const x = Math.random() * 100 - 50;
        const y = Math.random() * 100 - 50;
        btnNo.style.transform = `translate(${x}px, ${y}px)`;
    }

    btnYes.addEventListener('click', () => {
        modal.style.opacity = '0';
        christmasMusic.play().catch(e => console.log("自动播放被阻止:", e));

        setTimeout(() => {
            modal.style.display = 'none';
            // 1. 先触发To刘媛的显示+隐藏动画（总时长4秒）
            textTo.classList.add('fade-in-out');
            
            // 2. 延迟4秒（To刘媛完全消失后），触发Merry Christmas的显示动画
            setTimeout(() => {
              textMerry.classList.add('fade-in');
            }, 4000); // 4000毫秒 = To刘媛动画总时长
        }, 1000);
    });

    startChristmasScene();
  </script>
</body>
</html>
